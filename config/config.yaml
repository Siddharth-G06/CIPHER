# CIPHER Fraud Detection — Master Configuration
# -----------------------------------------------
# All magic numbers from data_preprocessing.py and graph_features.py are
# centralised here.  Changing a value here propagates to every module
# automatically — no hunting through source files required.

data:
  transaction_path: data/train_transaction.csv
  identity_path:    data/train_identity.csv

preprocessing:
  missing_threshold:    0.90   # drop columns whose null rate exceeds this
  train_frac:           0.80   # temporal split: first 80 % → train
  sentinel_fill_value: -999    # fill value for remaining nulls (LightGBM-safe sentinel)
  unseen_label_value:   -1     # integer assigned to out-of-vocabulary categories in test

graph_features:
  short_window_seconds:  3600  # 1-hour sliding window  (card_degree, merchant_degree)
  long_window_seconds:  86400  # 24-hour sliding window (tx_count, total_amt, zscore, pair)
  graph_sample_size:     1000  # rows used for the NetworkX visualisation graph only

# Reserved — not yet wired into feature engineering logic.
# Intended for a future correlation-based feature selection step.
feature_selection:
  correlation_threshold: 0.95

# ---------------------------------------------------------------------------
# ML Layer — Model Hyperparameters
# ---------------------------------------------------------------------------
model:
  lgbm:
    n_estimators: 500
    learning_rate: 0.05
    num_leaves: 63
    max_depth: -1
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_samples: 100
    reg_alpha: 0.1
    reg_lambda: 0.1
    # scale_pos_weight is auto-computed from y_train (neg/pos ratio) at runtime

  isolation_forest:
    n_estimators: 200
    max_samples: auto
    contamination: 0.035
    random_state: 42

  ensemble:
    lgbm_weight: 0.7
    iso_weight: 0.3
    threshold: 0.5

  artifacts:
    local_model_path: models/cipher_ensemble.pkl

# ---------------------------------------------------------------------------
# MLflow — Experiment Tracking & Model Registry
# ---------------------------------------------------------------------------
mlflow:
  experiment_name: cipher-fraud-detection
  tracking_uri: ./mlruns
  model_registry_name: CIPHERFraudDetector

# ---------------------------------------------------------------------------
# Drift Detection Layer
# ---------------------------------------------------------------------------
drift:
  adwin_delta: 0.002                       # ADWIN sensitivity — smaller = less sensitive
  rolling_error_buffer_size: 1000          # max errors kept in rolling buffer
  psi_current_window_size: 5000            # rows in current PSI comparison window
  psi_bins: 10                             # equal-width bins for PSI computation
  psi_warning_threshold: 0.1              # PSI ≥ this → warning (not yet notifying)
  psi_critical_threshold: 0.2             # PSI ≥ this → notify observers immediately
  retraining_trigger_path: logs/drift_events.json
  detector_state_path: models/drift_detector_state.pkl
  monitored_features:
    - card_degree_1h
    - merchant_degree_1h
    - card_tx_count_24h
    - amt_zscore_24h
  drift_simulation:
    injection_point: 0.7
    drift_type: high_value

# ---------------------------------------------------------------------------
# Explainability Layer — SHAP
# ---------------------------------------------------------------------------
explainer:
  model_path: models/cipher_ensemble.pkl
  lgbm_model_path: models/lgbm_model.pkl
  plots_dir: plots/shap
  max_cache_size: 10000
  threadpool_workers: 4
  top_features_count: 10
  interaction_top_n: 10
  global_sample_size: 5000

# ---------------------------------------------------------------------------
# Serving Layer — PDF Report Generator
# ---------------------------------------------------------------------------
report:
  output_dir: reports/
  cipher_version: "1.0.0"
  risk_tiers:
    low_threshold: 0.3
    medium_threshold: 0.5
    high_threshold: 0.75
  colors:
    low: "#28a745"
    medium: "#ffc107"
    high: "#fd7e14"
    critical: "#dc3545"
    header_text: "#ffffff"
    table_header: "#1a1a2e"
    row_alt: "#f8f9fa"
  page:
    size: A4
    margin_inches: 0.75
  shap_image:
    width_points: 450
    height_points: 300
    timeout_seconds: 10
  threadpool_workers: 2

# ---------------------------------------------------------------------------
# Kafka Streaming Layer
# ---------------------------------------------------------------------------
kafka:
  bootstrap_servers: localhost:9092
  topics:
    raw: cipher.transactions.raw
    flagged: cipher.transactions.flagged
    drift: cipher.drift.events
    feedback: cipher.feedback.labels
    dlq: cipher.transactions.dlq
  producer:
    acks: all
    retries: 3
    linger_ms: 5
    batch_size: 16384
    compression_type: snappy
  consumer:
    group_id: cipher-fraud-detector
    auto_offset_reset: earliest
    max_poll_interval_ms: 300000
    session_timeout_ms: 45000
  topic_config:
    raw_partitions: 3
    default_partitions: 1
    raw_retention_ms: 86400000          # 24 hours
    flagged_retention_ms: 2592000000    # 30 days
    drift_retention_ms: 7776000000      # 90 days
  stream:
    delay_ms: 100
    log_every_n: 1000
# ---------------------------------------------------------------------------
# Feedback & Automated Retraining Layer (Module 5)
# ---------------------------------------------------------------------------
feedback:
  db_path: data/feedback.db
  retraining_threshold: 100               # unused feedback records needed to trigger retraining
  scheduled_retraining_days: 7            # days between scheduled retraining runs
  min_improvement_auc_pr: 0.005           # challenger must beat champion auc_pr by this delta
  base_data_pickle_path: data/processed/train_featured.pkl
  model_updated_signal_path: models/model_updated.json
  trigger_poll_interval_seconds: 300      # how often RetrainingTrigger checks conditions
  feedback_base_weight_multiplier: 1.0    # sample weight for original base data rows

# ---------------------------------------------------------------------------
# Streamlit Dashboard (Module 9)
# ---------------------------------------------------------------------------
streamlit:
  page_title: "CIPHER — Fraud Detection"
  page_icon: "🛡️"
  layout: wide
  autorefresh_interval_ms: 3000
  live_monitor_rows: 100
  review_queue_max_display: 50
